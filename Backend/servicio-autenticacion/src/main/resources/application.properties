server.port=8081
spring.application.name=servicio-autenticacion

# --------- Datasource (MySQL) ---------
spring.datasource.url=jdbc:mysql://${DB_HOST:${HOST_DOCKER_INTERNAL:host.docker.internal}}:${DB_PORT:3306}/${DB_NAME_AUTH}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# --------- JPA / Hibernate ---------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --------- Flyway ---------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --------- JWT ---------
jwt.issuer=andinatrading-auth
jwt.access-exp-seconds=900
jwt.secret=${JWT_SECRET}

# --------- Logging ---------
logging.level.org.springframework.security=WARN
logging.level.co.edu.unbosque.foresta=INFO

# --------- Mail ---------
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8

# --------- Frontend URL ---------
app.frontend.base-url=http://localhost:5173

# --------- Intregaciones ---------
auditoria.base-url= http://servicio-auditoria:9090


