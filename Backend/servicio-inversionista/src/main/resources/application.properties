server.port=8083
server.address=0.0.0.0
spring.application.name=servicio-inversionista

# --------- Datasource (MySQL) ---------
spring.datasource.url=jdbc:mysql://${DB_HOST:${HOST_DOCKER_INTERNAL:host.docker.internal}}:${DB_PORT:3306}/${DB_NAME_INVERSIONISTAS}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# --------- JPA / Hibernate ---------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --------- Flyway ---------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --------- JWT ---------
jwt.issuer=andinatrading-auth
jwt.secret=${JWT_SECRET}

# --------- Integraciones internas ---------
auth.base-url=http://servicio-autenticacion:8081
catalogos.base-url=http://servicio-catalogos:8082

# --------- Broker ---------
alpaca.broker.account-url=https://broker-api.sandbox.alpaca.markets/v1/accounts
alpaca.broker.api.key=${ALPACA_BROKER_API_KEY}
alpaca.broker.api.secret=${ALPACA_BROKER_API_SECRET}

# --------- Logging / Actuator ---------
logging.level.org.springframework.security=INFO
logging.level.co.edu.unbosque.foresta=INFO

# --------- Clave compartida ---------
internal.api.key=${INTERNAL_API_KEY}
