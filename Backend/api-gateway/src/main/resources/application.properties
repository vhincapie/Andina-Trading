server.port=8080
spring.application.name=api-gateway
spring.profiles.active=docker

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true

# JWT
security.jwt.secret=${JWT_SECRET}

# CORS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

# ===== ROUTES =====
# 0) AUTH
spring.cloud.gateway.routes[0].id=auth
spring.cloud.gateway.routes[0].uri=http://servicio-autenticacion:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# 1) CATALOGOS
spring.cloud.gateway.routes[1].id=catalogos
spring.cloud.gateway.routes[1].uri=http://servicio-catalogos:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/catalogos/**
spring.cloud.gateway.routes[1].filters[0].name=JwtAuth

# 2) INVERSIONISTA
spring.cloud.gateway.routes[2].id=inversionista
spring.cloud.gateway.routes[2].uri=http://servicio-inversionista:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/inversionistas/**
spring.cloud.gateway.routes[2].filters[0].name=JwtAuth

# 3) COMISIONISTAS
