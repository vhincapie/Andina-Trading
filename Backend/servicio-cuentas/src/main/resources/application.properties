server.port=8086
server.address=0.0.0.0
spring.application.name=servicio-cuentas

# --------- Datasource ---------
spring.datasource.url=jdbc:mysql://${DB_HOST:${HOST_DOCKER_INTERNAL:host.docker.internal}}:${DB_PORT:3306}/${DB_NAME_CUENTAS}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# --------- JPA / Hibernate ---------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --------- Flyway ---------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --------- JWT ---------
jwt.issuer=andinatrading-auth
jwt.secret=${JWT_SECRET}

# --------- Integraciones ---------
inversionistas.base-url=http://servicio-inversionista:8083
auditoria.base-url= http://servicio-auditoria:9090


# --------- Broker Alpaca ---------
alpaca.broker.account-status-url=https://broker-api.sandbox.alpaca.markets/v1/trading/accounts
alpaca.broker.ach-url-template=https://broker-api.sandbox.alpaca.markets/v1/accounts/{account_id}/ach_relationships
alpaca.broker.transfers-url-template=https://broker-api.sandbox.alpaca.markets/v1/accounts/{account_id}/transfers
alpaca.broker.api.key=${ALPACA_BROKER_API_KEY}
alpaca.broker.api.secret=${ALPACA_BROKER_API_SECRET}

# --------- Logs ---------
logging.level.org.springframework.security=WARN
logging.level.co.edu.unbosque.foresta=INFO

