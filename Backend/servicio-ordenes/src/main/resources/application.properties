server.port=8087
server.address=0.0.0.0
spring.application.name=servicio-ordenes

# --- Datasource ---
spring.datasource.url=jdbc:mysql://${DB_HOST:${HOST_DOCKER_INTERNAL:host.docker.internal}}:${DB_PORT:3306}/${DB_NAME_ORDENES}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
jwt.issuer=andinatrading-auth
jwt.secret=${JWT_SECRET}

# --- Integraciones internas ---
inversionistas.base-url=http://servicio-inversionista:8083
comisionistas.base-url=http://servicio-comisionista:8084
contratos.base-url=http://servicio-contratos:8085
cuentas.base-url=http://servicio-cuentas:8086
notificaciones.base-url=http://servicio-notificaciones:8089
auditoria.base-url= http://servicio-auditoria:9090

# --- Alpaca ---
alpaca.broker.api.key=${ALPACA_BROKER_API_KEY}
alpaca.broker.api.secret=${ALPACA_BROKER_API_SECRET}
alpaca.trading.orders-url=https://broker-api.sandbox.alpaca.markets/v1/trading/accounts
alpaca.broker.account-status-url=https://broker-api.sandbox.alpaca.markets/v1/trading/accounts

# --- Finnhub ---
finnhub.api.key=${FINNHUB_API_KEY}

# --- Logs ---
logging.level.org.springframework.scheduling=DEBUG
logging.level.co.edu.unbosque.foresta.service.implementations.OrderSyncService=DEBUG

# --------- Clave compartida ---------
internal.api.key=${INTERNAL_API_KEY}

logging.level.co.edu.unbosque.foresta.service.implementations.OrdenServiceImpl=DEBUG
logging.level.co.edu.unbosque.foresta.integration.AlpacaTradingClient=DEBUG
